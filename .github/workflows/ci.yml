name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt

      # 4. Run linting
      - name: Run ruff
        run: ruff check src/

      # 5. Run SQL tests
      - name: Run SQL tests
        run: python tests/sql/run_sql_tests.py

      # 6. Run unit tests
      - name: Run unit tests
        run: pytest tests/unit/